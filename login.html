<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Modern Digi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/images/logo1.png">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-2 shadow-sm" style="width: 55px; height: 55px;">
                                <i class="bi bi-laptop fs-4"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-0">Modern<span class="text-primary">Digi</span></h3>
                        </a>
                        <p class="text-secondary small mt-1">Please enter your credentials to log in</p>
                    </div>

                    <form action="index.html" method="GET">
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-muted">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control bg-light border-start-0 ps-0 shadow-none" id="email" placeholder="example@gmail.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-muted">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0 shadow-none" id="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 small">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label text-secondary" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none text-primary fw-semibold">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill shadow-sm">
                            Log In <i class="bi bi-arrow-right ms-1"></i>
                        </button>

                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <span class="text-secondary">Don't have an account?</span> 
                        <a href="register.html" class="text-decoration-none fw-bold text-primary ms-1">Register here</a>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
